# Enable DEBUG level for KecongUdpChannel to exercise debug logging branches
org.slf4j.simpleLogger.log.com.kecong.opentcs.protocol.KecongUdpChannel=debug
# Default level for everything else
org.slf4j.simpleLogger.defaultLogLevel=info
# Show thread name and short logger name
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true
